<!-- TITLE: admin/activity.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFLO MASTER | Real-time Audit & Activity Logs</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <style>
        :root {
            --adm-primary: #6366f1;
            --adm-primary-hover: #4f46e5;
            --adm-gradient: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%);
        }

        .admin-master-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #0f172a;
            color: #ffffff;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .admin-nav-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: -0.5px;
        }

        .activity-page-container {
            padding: 0 20px 100px;
            max-width: 860px;
            margin: 0 auto;
        }

        .activity-hero-card {
            background: var(--adm-gradient);
            color: #ffffff;
            border-radius: 28px;
            padding: 24px 28px;
            margin: 20px 0 25px;
            box-shadow: 0 12px 30px rgba(67, 56, 202, 0.25);
        }

        .activity-hero-card h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.5px; margin: 0 0 6px; }
        .activity-hero-card p { font-size: 0.85rem; opacity: 0.85; margin: 0 0 15px; }

        .hero-live-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(34, 197, 94, 0.2); color: #4ade80;
            padding: 4px 12px; border-radius: 12px; font-size: 0.72rem;
            font-weight: 800; letter-spacing: 0.5px;
        }

        .live-pulse-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e; box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .search-input-wrap { margin-bottom: 14px; }
        .search-input-box {
            width: 100%; padding: 14px 18px; border-radius: 16px;
            border: 1.5px solid var(--border); background: var(--bg-card);
            color: var(--text-main); font-size: 0.95rem; font-weight: 600; outline: none;
            box-shadow: var(--shadow);
        }
        .search-input-box:focus { border-color: var(--adm-primary); }

        .filter-scroll-row {
            display: flex; gap: 8px; overflow-x: auto;
            padding-bottom: 12px; margin-bottom: 20px; scrollbar-width: none;
        }
        .filter-scroll-row::-webkit-scrollbar { display: none; }

        .adm-filter-pill {
            padding: 8px 16px; border-radius: 18px; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text-main); font-size: 0.75rem;
            font-weight: 800; white-space: nowrap; cursor: pointer; transition: all 0.2s ease;
            flex-shrink: 0; outline: none;
        }
        .adm-filter-pill.active {
            background: var(--adm-primary) !important; color: #ffffff !important;
            border-color: var(--adm-primary) !important; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .event-log-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 22px; padding: 18px 20px; margin-bottom: 12px;
            display: flex; align-items: flex-start; gap: 16px; box-shadow: var(--shadow);
            transition: transform 0.15s;
        }
        .event-log-card:active { transform: scale(0.99); }

        .event-icon-avatar {
            width: 44px; height: 44px; border-radius: 14px; display: flex;
            align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0;
        }

        .evt-registration { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .evt-login { background: rgba(100, 116, 139, 0.15); color: #64748b; }
        .evt-subscription, .evt-payment { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .evt-feedback { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .evt-booking { background: rgba(14, 165, 233, 0.15); color: #0ea5e9; }
        .evt-support { background: rgba(236, 72, 153, 0.15); color: #ec4899; }
        .evt-admin_action { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

        .event-body-content { flex: 1; }
        .event-top-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .event-title-text { font-size: 0.95rem; font-weight: 800; color: var(--text-main); }
        .event-time-stamp { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; }
        .event-desc-text { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 6px; }
        .event-entity-tag {
            display: inline-block; background: var(--bg-body); border: 1px solid var(--border);
            padding: 3px 8px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; color: var(--text-main);
        }

        .table-actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .table-actions-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-export-csv {
            background: var(--bg-card); border: 1.5px solid var(--border); color: var(--text-main);
            padding: 8px 16px; border-radius: 12px; font-size: 0.75rem; font-weight: 800; cursor: pointer; transition: all 0.15s;
        }
        .btn-export-csv:hover { border-color: var(--adm-primary); color: var(--adm-primary); }
    </style>
</head>
<body class="dashboard-layout">

    <header class="admin-master-header">
        <button class="admin-nav-btn" onclick="location.href='dashboard.html'">
            <span>◀ REFLO MASTER</span>
        </button>
        <button onclick="RefloTheme.toggle()" style="background: #1e293b; border: 1px solid #334155; padding: 10px; border-radius: 50%; cursor: pointer; color: white; font-size: 1.1rem;">🌓</button>
    </header>

    <main class="activity-page-container">
        <section class="activity-hero-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h1>Platform Audit & Activity Logs</h1>
                    <p>Real-time telemetry across registrations, payments, customer reviews, appointments, and admin actions.</p>
                </div>
                <div class="hero-live-badge">
                    <span class="live-pulse-dot"></span>
                    <span>LIVE STREAM</span>
                </div>
            </div>
        </section>

        <!-- SEARCH BAR -->
        <div class="search-input-wrap">
            <input type="text" id="activitySearchInput" class="search-input-box" placeholder="Search by event title, business name, or description..." oninput="AdminActivity.handleSearch(this.value)">
        </div>

        <!-- FILTER CHIPS -->
        <div class="filter-scroll-row">
            <button type="button" class="adm-filter-pill active" data-filter="all" onclick="AdminActivity.setFilter('all', this)">All Events</button>
            <button type="button" class="adm-filter-pill" data-filter="registration" onclick="AdminActivity.setFilter('registration', this)">👤 Signups</button>
            <button type="button" class="adm-filter-pill" data-filter="payment" onclick="AdminActivity.setFilter('payment', this)">💳 Payments & Subs</button>
            <button type="button" class="adm-filter-pill" data-filter="feedback" onclick="AdminActivity.setFilter('feedback', this)">⭐ Reviews</button>
            <button type="button" class="adm-filter-pill" data-filter="booking" onclick="AdminActivity.setFilter('booking', this)">📅 Bookings</button>
            <button type="button" class="adm-filter-pill" data-filter="support" onclick="AdminActivity.setFilter('support', this)">💬 Support</button>
            <button type="button" class="adm-filter-pill" data-filter="admin_action" onclick="AdminActivity.setFilter('admin_action', this)">🛡️ Admin</button>
        </div>

        <div class="table-actions-bar">
            <span id="activityCountLabel" style="font-size: 0.8rem; font-weight: 800; color: var(--text-muted);">
                Showing 0 events
            </span>
            <div class="table-actions-buttons">
                <!-- HIDE / UNHIDE ACTIVITIES BUTTON -->
                <button type="button" class="btn-export-csv" id="toggleActivityFeedBtn" onclick="AdminActivity.toggleFeed()">
                    👁️ Hide Activities
                </button>
                <button type="button" class="btn-export-csv" onclick="AdminActivity.exportCSV()">
                    📥 Export Audit CSV
                </button>
            </div>
        </div>

        <!-- LIVE EVENT LOG FEED -->
        <div id="activityEventFeed">
            <div class="skeleton-item-long" style="height: 80px; border-radius: 22px; margin-bottom: 12px;"></div>
            <div class="skeleton-item-long" style="height: 80px; border-radius: 22px; margin-bottom: 12px;"></div>
            <div class="skeleton-item-long" style="height: 80px; border-radius: 22px;"></div>
        </div>

        <div class="section-label" style="margin-top: 40px;">Admin Gateway</div>
        <div class="settings-card nav-utility-card">
            <div class="nav-grid-3">
                <a href="dashboard.html" class="nav-shortcut"><i>🏢</i><span>Master</span></a>
                <a href="businesses.html" class="nav-shortcut"><i>📋</i><span>Directory</span></a>
                <a href="support.html" class="nav-shortcut"><i>📩</i><span>Support</span></a>
                <a href="settings.html" class="nav-shortcut"><i>⚙️</i><span>Pricing</span></a>
                <a href="../app/dashboard.html" class="nav-shortcut"><i>👤</i><span>User App</span></a>
                <a href="../login.html" class="nav-shortcut"><i>🚪</i><span>Sign Out</span></a>
            </div>
        </div>
    </main>

    <p class="reflo-powered-tag">
        <em>REFLO powered by HDC</em>
    </p>

    <!-- DEPENDENCIES -->
    <script src="../assets/js/network-listener.js"></script>
    <script src="../assets/js/security.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/admin/Activity.js"></script>
</body>
</html>
