<!-- TITLE: offline.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connection Lost | REFLO</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px;
            text-align: center;
        }

        .offline-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: 32px;
            padding: 40px 25px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow);
            position: relative;
        }

        .radar-icon-wrap {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(37, 99, 235, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(37, 99, 235, 0.2);
        }

        .radar-icon-wrap span {
            font-size: 2.8rem;
        }

        .offline-card h1 {
            font-size: 1.45rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .offline-card p {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.5;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .btn-reconnect {
            width: 100%;
            padding: 16px;
            background: #2563eb !important;
            color: #ffffff !important;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s;
        }

        .btn-reconnect:active { transform: scale(0.97); }

        .troubleshoot-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: left;
            line-height: 1.6;
        }

        .troubleshoot-box strong {
            display: block;
            color: var(--text-main);
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="offline-card">
        <div class="radar-icon-wrap">
            <span>📡</span>
        </div>

        <h1>No Internet Connection</h1>
        <p>REFLO cannot reach the server right now. Please check your mobile data or Wi-Fi connection and tap below to retry.</p>

        <button type="button" class="btn-reconnect" id="retryBtn" onclick="handleRetry()">
            <span>🔄</span>
            <span>Tap to Reconnect</span>
        </button>

        <div class="troubleshoot-box">
            <strong>Quick Troubleshooting:</strong>
            • Toggle Airplane mode on and off<br>
            • Check if mobile data or Wi-Fi is active<br>
            • Your account data and drafts are safe
        </div>
    </div>

    <script>
        function handleRetry() {
            const btn = document.getElementById('retryBtn');
            btn.innerHTML = '<span>⏳</span><span>Checking connection...</span>';
            btn.disabled = true;

            setTimeout(() => {
                if (navigator.onLine) {
                    window.location.reload();
                } else {
                    btn.innerHTML = '<span>🔄</span><span>Still Offline — Tap to Retry</span>';
                    btn.disabled = false;
                }
            }, 1200);
        }

        // Automatic auto-reload when internet comes back
        window.addEventListener('online', () => {
            document.getElementById('retryBtn').innerHTML = '<span>✨</span><span>Connection Restored! Reloading...</span>';
            setTimeout(() => window.location.reload(), 500);
        });
    </script>
</body>
</html>
