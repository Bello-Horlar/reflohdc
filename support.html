<!-- TITLE: app/support.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFLO | Support Helpdesk</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <style>
        .support-container { padding: 0 25px 100px; max-width: 720px; margin: 0 auto; }
        
        .ticket-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 18px 20px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            gap: 15px;
        }
        .ticket-card:active { transform: scale(0.98); }

        .ticket-info { flex: 1; min-width: 0; }
        .ticket-info h3 { 
            font-size: 0.98rem; font-weight: 800; margin-bottom: 4px; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ticket-last-snippet {
            font-size: 0.82rem; color: var(--text-muted); font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 4px; display: block;
        }
        .ticket-meta-date { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; }

        .status-tag {
            font-size: 0.65rem; font-weight: 900; padding: 6px 12px;
            border-radius: 10px; text-transform: uppercase; letter-spacing: 0.8px;
            flex-shrink: 0;
        }
        .status-open { background: rgba(34, 197, 94, 0.12); color: #22c55e; }
        .status-pending { background: rgba(245, 158, 11, 0.12); color: #f59e0b; }
        .status-closed { background: rgba(100, 116, 139, 0.12); color: #64748b; }

        .modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px);
            display: none; align-items: center; 
            justify-content: center; z-index: 2000; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-card { 
            background: var(--bg-card); width: 100%; max-width: 460px; 
            border-radius: 30px; padding: 32px 26px; box-shadow: var(--shadow); 
            border: 1px solid var(--border);
        }

        .action-sheet-modal {
            background: var(--bg-card); width: 100%; max-width: 400px;
            border-radius: 28px; padding: 25px 20px; box-shadow: var(--shadow-lg);
            text-align: center; border: 1.5px solid var(--border);
        }
        .btn-delete-danger {
            background: #ef4444 !important; color: #ffffff !important;
            padding: 14px; border-radius: 14px; font-weight: 900;
            border: none; width: 100%; cursor: pointer; margin-bottom: 10px;
        }
    </style>
</head>
<body class="dashboard-layout">

    <header class="master-header">
        <button class="brand-nav-btn" onclick="location.href='dashboard.html'">
            <span>❮ REFLO</span>
        </button>
        <button onclick="RefloTheme.toggle()" style="background: none; border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center;">🌓</button>
    </header>

    <main class="support-container">
        <div class="master-page-title" style="padding: 25px 0 15px;">
            <h1 style="font-size: 1.6rem; font-weight: 900; letter-spacing: -1px;">Support Helpdesk</h1>
            <p style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Direct communication with the REFLO executive team</p>
        </div>

        <button class="btn-primary" id="openModalBtn" style="margin-bottom: 25px;">
            + Create New Support Ticket
        </button>

        <div class="section-label">Your Conversations</div>
        
        <div id="ticket-list">
            <div class="skeleton-item-long" style="height: 80px; border-radius: 22px; margin-bottom: 15px;"></div>
            <div class="skeleton-item-long" style="height: 80px; border-radius: 22px;"></div>
        </div>

        <!-- NEW TICKET MODAL -->
        <div class="modal" id="ticketModal">
            <div class="modal-card">
                <h2 style="font-weight: 900; margin-bottom: 6px; font-size: 1.3rem;">New Support Ticket</h2>
                <p class="text-muted" style="font-size: 0.82rem; margin-bottom: 20px;">Describe your question or issue below:</p>

                <div class="input-group" style="margin-bottom: 15px;">
                    <label style="font-size: 0.72rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">SUBJECT</label>
                    <input type="text" id="newSubject" class="form-input-box" placeholder="e.g. Help with custom QR branding">
                </div>
                <div class="input-group" style="margin-bottom: 15px;">
                    <label style="font-size: 0.72rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">MESSAGE</label>
                    <textarea id="newMessage" class="form-input-box" rows="4" placeholder="How can our support team assist you?"></textarea>
                </div>
                <div class="input-group" style="margin-bottom: 25px;">
                    <label style="font-size: 0.72rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">ATTACH SCREENSHOT (OPTIONAL)</label>
                    <input type="file" id="newImage" accept="image/*" style="padding: 10px; font-size: 0.8rem; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-body); width: 100%;">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn-outline" style="flex: 1; padding: 14px;" id="cancelModalBtn">Cancel</button>
                    <button type="button" class="btn-primary" style="flex: 2; padding: 14px;" id="submitTicketBtn" onclick="SupportApp.submitNewTicket()">Submit Ticket</button>
                </div>
            </div>
        </div>

        <!-- LONG-PRESS ACTION SHEET MODAL (FOR TICKET DELETION) -->
        <div class="modal" id="longPressDeleteModal">
            <div class="action-sheet-modal">
                <div style="font-size: 2.2rem; margin-bottom: 8px;">🗑️</div>
                <h3 style="font-size: 1.15rem; font-weight: 900; margin-bottom: 6px;">Manage Support Ticket</h3>
                <p class="text-muted" style="font-size: 0.82rem; margin-bottom: 20px;" id="deleteTicketSubjectDisplay">Delete this conversation thread?</p>

                <button type="button" class="btn-delete-danger" id="confirmDeleteTicketBtn" onclick="SupportApp.executeDeleteTicket()">
                    Delete Ticket & Messages
                </button>
                <button type="button" class="btn-outline" style="padding: 12px;" onclick="SupportApp.closeDeleteTicketModal()">
                    Cancel
                </button>
            </div>
        </div>

        <!-- QUICK NAV UTILITY CARD -->
        <div class="section-label" style="margin-top: 50px;">Quick Navigation</div>
        <div class="settings-card nav-utility-card">
            <div class="nav-grid-3">
                <a href="dashboard.html" class="nav-shortcut"><i>🏠</i><span>Home</span></a>
                <a href="feedback.html" class="nav-shortcut"><i>⭐</i><span>Reviews</span></a>
                <a href="bookings.html" class="nav-shortcut"><i>📅</i><span>Bookings</span></a>
                <a href="subscription.html" class="nav-shortcut"><i>💳</i><span>Plans</span></a>
                <a href="share.html" class="nav-shortcut"><i>🔳</i><span>QR Hub</span></a>
                <a href="profile.html" class="nav-shortcut"><i>⚙️</i><span>Profile</span></a>
            </div>
        </div>
    </main>

    <p class="reflo-powered-tag">
        <em>REFLO powered by HDC</em>
    </p>

    <!-- DEPENDENCIES -->
<script src="../assets/js/network-listener.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/user/Support.js"></script>
<!-- TRIAL & PLAN ENTITLEMENT GATE -->
    <script src="../assets/js/trial-gate.js"></script>
</body>
</html>
