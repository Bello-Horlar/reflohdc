<!-- TITLE: app/feedback.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFLO | feedback</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <style>
        .feedback-page-container {
            padding: 0 25px 100px;
            max-width: 780px;
            margin: 0 auto;
        }

        /* Filter Command Bar */
        .filter-control-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 26px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: var(--shadow);
        }

        .search-input-wrap {
            position: relative;
            margin-bottom: 15px;
        }

        .search-input-box {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border-radius: 16px;
            border: 1.5px solid var(--border);
            background: var(--bg-body);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input-box:focus {
            border-color: var(--primary);
        }

        .search-icon-pos {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Responsive Filter Grid */
        .filters-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        @media (max-width: 640px) {
            .filters-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 420px) {
            .filters-grid {
                grid-template-columns: 1fr;
            }
        }

        .filter-select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-body);
            color: var(--text-main);
            font-size: 0.8rem;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .filter-header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 5px 15px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-muted);
        }

        /* Feedback Item Cards */
        .feedback-item-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 14px;
            display: block;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--shadow);
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .feedback-item-card:active {
            transform: scale(0.98);
        }

        /* Prominent Low Rating Alert (1-3 Stars) */
        .feedback-item-card.rating-low {
            border-left: 5px solid #ef4444;
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.04) 0%, var(--bg-card) 15%);
        }

        /* Positive Rating (4-5 Stars) */
        .feedback-item-card.rating-high {
            border-left: 5px solid #22c55e;
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .stars-badge-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stars-display {
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .rating-num-tag {
            font-size: 0.75rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 8px;
        }
        .tag-low { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .tag-high { background: rgba(34, 197, 94, 0.15); color: #22c55e; }

        .customer-comment-text {
            font-size: 0.92rem;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 14px;
            color: var(--text-main);
        }

        .card-footer-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 0.78rem;
        }

        .customer-author {
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-pill-badge {
            font-size: 0.65rem;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .status-new { background: rgba(239, 68, 68, 0.12); color: #ef4444; }
        .status-contacted { background: rgba(245, 158, 11, 0.12); color: #f59e0b; }
        .status-in_progress { background: rgba(37, 99, 235, 0.12); color: #2563eb; }
        .status-resolved { background: rgba(34, 197, 94, 0.12); color: #22c55e; }

        .reset-filter-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body class="dashboard-layout">

    <!-- MASTER HEADER -->
    <header class="master-header">
        <button class="brand-nav-btn" onclick="location.href='dashboard.html'">
            <span>❮ REFLO</span>
        </button>
        <button onclick="RefloTheme.toggle()" style="background: none; border: 1px solid var(--border); padding: 10px; border-radius: 50%; cursor: pointer; font-size: 1.1rem;">🌓</button>
    </header>

    <main class="feedback-page-container">
        <!-- TITLE SECTION -->
        <div class="master-page-title" style="padding: 25px 0 15px;">
            <h1 style="font-size: 1.6rem; font-weight: 900; letter-spacing: -1px;">Customer Feedback & Reviews</h1>
            <p style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Manage private feedback, trigger recovery workflows, and resolve customer issues</p>
        </div>

        <!-- 1. MULTI-FILTER CONTROL CARD (Requirement #42) -->
        <section class="filter-control-card">
            <!-- 1. Search Bar -->
            <div class="search-input-wrap">
                <span class="search-icon-pos">🔍</span>
                <input type="text" id="feedbackSearchInput" class="search-input-box" placeholder="Search customer name, phone, or comment..." oninput="FeedbackApp.applyFilters()">
            </div>

            <!-- 2. The 5 Filter Dropdowns -->
            <div class="filters-grid">
                <!-- Rating Filter -->
                <select id="filterRating" class="filter-select" onchange="FeedbackApp.applyFilters()">
                    <option value="all">⭐ All Ratings</option>
                    <option value="needs_attention">🔴 Needs Attention (1–3★)</option>
                    <option value="positive">🟢 Positive (4–5★)</option>
                    <option value="5">5 Stars only</option>
                    <option value="4">4 Stars only</option>
                    <option value="3">3 Stars only</option>
                    <option value="2">2 Stars only</option>
                    <option value="1">1 Star only</option>
                </select>

                <!-- Date Filter -->
                <select id="filterDate" class="filter-select" onchange="FeedbackApp.applyFilters()">
                    <option value="all">📅 All Time</option>
                    <option value="today">Today</option>
                    <option value="7days">Last 7 Days</option>
                    <option value="30days">Last 30 Days</option>
                </select>

                <!-- Status Filter -->
<select id="filterStatus" class="filter-select" onchange="FeedbackApp.handleFilterChange('status')">
    <option value="all">⚡ All Statuses</option>
    <option value="new">New (Needs Action)</option>
    <option value="contacted">Contacted</option>
    <option value="in_progress">In Progress</option>
    <option value="resolved">Resolved ✓</option>
</select>

<!-- Contacted Filter -->
<select id="filterContacted" class="filter-select" onchange="FeedbackApp.handleFilterChange('contacted')">
    <option value="all">📞 Contact Status: All</option>
    <option value="contacted">Contacted</option>
    <option value="not_contacted">Not Contacted</option>
</select>

<!-- Resolved Filter -->
<select id="filterResolved" class="filter-select" onchange="FeedbackApp.handleFilterChange('resolved')">
    <option value="all">🏁 Resolution: All</option>
    <option value="resolved">Resolved only</option>
    <option value="unresolved">Unresolved only</option>
</select>

                <!-- Reset Button -->
                <button type="button" class="filter-select reset-filter-btn" onclick="FeedbackApp.resetFilters()">
                    ↺ Reset Filters
                </button>
            </div>
        </section>

        <!-- Count Indicator -->
        <div class="filter-header-meta">
            <span id="feedbackCountLabel">Showing feedback...</span>
            <span id="urgentAlertCount" style="color: #ef4444; display: none;">⚠️ Urgent items require recovery</span>
        </div>

        <!-- 2. FEEDBACK LIST CONTAINER -->
        <div id="feedbackListContainer">
            <div class="skeleton-item-long" style="height: 110px; border-radius: 22px; margin-bottom: 14px;"></div>
            <div class="skeleton-item-long" style="height: 110px; border-radius: 22px; margin-bottom: 14px;"></div>
            <div class="skeleton-item-long" style="height: 110px; border-radius: 22px;"></div>
        </div>

        <!-- QUICK NAV UTILITY CARD -->
        <div class="section-label" style="margin-top: 40px;">Quick Navigation</div>
        <div class="settings-card nav-utility-card">
            <div class="nav-grid-3">
                <a href="dashboard.html" class="nav-shortcut"><i>🏠</i><span>Home</span></a>
                <a href="bookings.html" class="nav-shortcut"><i>📅</i><span>Bookings</span></a>
                <a href="analytics.html" class="nav-shortcut"><i>📊</i><span>Analytics</span></a>
                <a href="profile.html" class="nav-shortcut"><i>⚙️</i><span>Profile</span></a>
                <a href="share.html" class="nav-shortcut"><i>🔳</i><span>QR Hub</span></a>
                <a href="support.html" class="nav-shortcut"><i>📩</i><span>Support</span></a>
            </div>
        </div>
    </main>
<p class="reflo-powered-tag">
    <em>REFLO powered by HDC</em>
</p>
    <!-- DEPENDENCIES -->
<script src="../assets/js/network-listener.js"></script>
<script src="../assets/js/security.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/user/Feedback.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/notifications.js"></script>
<!-- TRIAL & PLAN ENTITLEMENT GATE -->
    <script src="../assets/js/trial-gate.js"></script>
</body>
</html>
