<!-- TITLE: forgot-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFLO | Reset Your Password</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        .auth-page-wrapper { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg-body); }
        .auth-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: var(--bg-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .header-left-group { display: flex; align-items: center; gap: 10px; }
        .title-back-btn { background: none; border: none; font-size: 1.5rem; font-weight: 900; color: var(--text-main); cursor: pointer; padding: 0 4px 0 0; display: flex; align-items: center; }
        .auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 20px 60px; }
        .auth-card-box { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 32px; padding: 40px 30px; width: 100%; max-width: 460px; box-shadow: var(--shadow); text-align: center; }
        .input-group-item { margin-bottom: 18px; text-align: left; }
        .input-group-item label { display: block; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
        .auth-input-field { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--bg-card) !important; color: var(--text-main) !important; font-size: 0.95rem; font-weight: 600; outline: none; }
        .password-input-wrap { position: relative; display: flex; align-items: center; }
        .btn-toggle-pwd { position: absolute; right: 12px; background: none; border: none; font-size: 1.1rem; cursor: pointer; color: var(--text-muted); padding: 4px; }
        .btn-auth-submit { width: 100%; padding: 16px; background: #2563eb !important; color: #ffffff !important; border: none; border-radius: 16px; font-size: 1.05rem; font-weight: 900; cursor: pointer; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); transition: transform 0.15s; }
        .btn-auth-submit:active { transform: scale(0.98); }

        .otp-code-input {
            font-size: 2.2rem;
            letter-spacing: 12px;
            text-align: center;
            font-weight: 900;
            color: var(--primary);
            background: var(--bg-body) !important;
            border: 2px solid var(--border);
            margin: 10px 0 18px;
        }
        .otp-code-input:focus { border-color: var(--primary); }

        .timer-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.15);
            color: #d97706;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 800;
            margin-bottom: 15px;
        }
    </style>
</head>
<body class="auth-page-wrapper">

    <header class="auth-header">
        <div class="header-left-group">
            <button class="title-back-btn" onclick="location.href='login.html'">❮</button>
            <img src="assets/images/reflo-icon.png" alt="REFLO" style="height: 28px; width: 28px; object-fit: contain;">
            <span style="font-weight: 900; color: var(--primary); font-size: 1.15rem;">REFLO</span>
        </div>
        <button onclick="RefloTheme.toggle()" style="background: var(--bg-body); border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;">🌓</button>
    </header>

    <main class="auth-main">
        <div class="auth-card-box">
            <div style="font-size: 2.8rem; margin-bottom: 8px;">🔑</div>
            <h1 style="font-size: 1.65rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 6px;">Reset Password</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600; margin-bottom: 22px;" id="resetSubtitle">
                Enter your email address to receive a 20-minute reset code.
            </p>

            <!-- STEP 1: ENTER EMAIL -->
            <form id="step1EmailForm" onsubmit="ForgotApp.handleSendOtp(event)">
                <div class="input-group-item">
                    <label>Business Email Address *</label>
                    <input type="email" id="resetEmailInput" class="auth-input-field" placeholder="name@business.com" required autocomplete="email">
                </div>
                <button type="submit" class="btn-auth-submit" id="sendOtpBtn">
                    Send 20-Minute Reset Code →
                </button>
            </form>

            <!-- STEP 2: VERIFY 6-DIGIT OTP CODE -->
            <form id="step2OtpForm" style="display: none;" onsubmit="ForgotApp.handleVerifyOtp(event)">
                <div class="timer-badge" id="recoveryTimerDisplay">⏳ Code valid for: 20:00</div>

                <div class="input-group-item">
                    <label>Enter 6-Digit Verification Code *</label>
                    <input type="text" id="resetOtpInput" class="auth-input-field otp-code-input" placeholder="••••••" maxlength="6" required autocomplete="one-time-code">
                </div>

                <button type="submit" class="btn-auth-submit" id="verifyOtpBtn" style="margin-bottom: 12px;">
                    Verify Code →
                </button>

                <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px;">
                    <button type="button" class="btn-outline" style="padding: 10px 14px; font-size: 0.78rem;" onclick="ForgotApp.resendCode()">
                        Resend Code
                    </button>
                    <button type="button" class="btn-outline" style="padding: 10px 14px; font-size: 0.78rem; border-color: transparent;" onclick="ForgotApp.resetToStep1()">
                        Change Email
                    </button>
                </div>
            </form>

            <!-- STEP 3: CREATE NEW PASSWORD (ONLY AFTER OTP VERIFICATION) -->
            <form id="step3PasswordForm" style="display: none;" onsubmit="ForgotApp.handleSavePassword(event)">
                <div class="input-group-item">
                    <label>New Password (Min. 8 chars) *</label>
                    <div class="password-input-wrap">
                        <input type="password" id="newPassInput" class="auth-input-field" placeholder="••••••••" minlength="8" required autocomplete="new-password">
                        <button type="button" class="btn-toggle-pwd" onclick="ForgotApp.toggleVisibility('newPassInput', this)">👁️</button>
                    </div>
                </div>

                <div class="input-group-item">
                    <label>Confirm New Password *</label>
                    <div class="password-input-wrap">
                        <input type="password" id="confirmPassInput" class="auth-input-field" placeholder="••••••••" minlength="8" required autocomplete="new-password">
                        <button type="button" class="btn-toggle-pwd" onclick="ForgotApp.toggleVisibility('confirmPassInput', this)">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit" id="saveNewPassBtn">
                    Update & Save Password 🔒
                </button>
            </form>

            <div style="margin-top: 22px; font-size: 0.88rem; font-weight: 700;">
                Remembered password? <a href="login.html" style="color: var(--primary); text-decoration: none;">Sign In</a>
            </div>

            <p class="reflo-powered-tag">
                <em>REFLO powered by HDC</em>
            </p>
        </div>
    </main>

    <!-- DEPENDENCIES -->
    <script src="assets/js/network-listener.js"></script>
    <script src="assets/js/security.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/otp.js"></script>
    <script>
        const ForgotApp = {
            targetEmail: '',
            timerInterval: null,

            async init() {
                const activeSession = RefloOTP.getActiveSession('recovery');
                if (activeSession) {
                    this.targetEmail = activeSession.email;
                    this.showStep2View(activeSession.email, activeSession.remainingSeconds);
                }
            },

            showStep2View(email, remainingSeconds) {
                document.getElementById('step1EmailForm').style.display = 'none';
                document.getElementById('step2OtpForm').style.display = 'block';
                document.getElementById('step3PasswordForm').style.display = 'none';
                document.getElementById('resetSubtitle').innerText = `Enter the 6-digit verification code sent to ${email}:`;
                document.getElementById('resetOtpInput').focus();

                this.startCountdown(remainingSeconds);
            },

            showStep3View() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                document.getElementById('step1EmailForm').style.display = 'none';
                document.getElementById('step2OtpForm').style.display = 'none';
                document.getElementById('step3PasswordForm').style.display = 'block';
                document.getElementById('resetSubtitle').innerText = 'Verification successful! Set your new password below:';
                document.getElementById('newPassInput').focus();
            },

            startCountdown(totalSeconds) {
                if (this.timerInterval) clearInterval(this.timerInterval);
                let remaining = totalSeconds || (20 * 60);

                const display = document.getElementById('recoveryTimerDisplay');
                const update = () => {
                    const mins = Math.floor(remaining / 60);
                    const secs = remaining % 60;
                    if (display) {
                        display.innerText = `⏳ Code valid for: ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                    }
                    if (remaining <= 0) {
                        clearInterval(this.timerInterval);
                        if (display) display.innerText = '❌ Code Expired. Please tap Resend.';
                    }
                    remaining--;
                };

                update();
                this.timerInterval = setInterval(update, 1000);
            },

            toggleVisibility(id, btn) {
                const input = document.getElementById(id);
                if (!input) return;
                input.type = input.type === 'password' ? 'text' : 'password';
                btn.style.opacity = input.type === 'password' ? '0.6' : '1';
            },

            // 1. Send Code
            async handleSendOtp(e) {
                e.preventDefault();
                const email = document.getElementById('resetEmailInput').value.trim();
                this.targetEmail = email;

                App.setLoading('sendOtpBtn', true, 'Sending 20-minute code...');

                try {
                    const result = await RefloOTP.requestOtp(email, 'recovery');
                    this.showStep2View(email, result.minutesRemaining * 60);
                    App.toast("20-minute reset code sent to your email! 📩", "info");
                } catch (err) {
                    App.toast("Error: " + err.message, "error");
                    App.setLoading('sendOtpBtn', false, 'Send 20-Minute Reset Code →');
                }
            },

            // 2. Verify OTP First
            async handleVerifyOtp(e) {
                e.preventDefault();
                const otp = document.getElementById('resetOtpInput').value.trim();

                if (otp.length !== 6) {
                    App.toast("Please enter the complete 6-digit code.", "warning");
                    return;
                }

                App.setLoading('verifyOtpBtn', true, 'Verifying code...');

                try {
                    await RefloOTP.verifyOtp(this.targetEmail, otp, 'recovery');
                    RefloOTP.clearActiveSession();
                    App.toast("Code verified! Now choose your password.", "success");
                    this.showStep3View();
                } catch (err) {
                    App.toast("Verification failed: " + err.message, "error");
                    App.setLoading('verifyOtpBtn', false, 'Verify Code →');
                }
            },

            // 3. Save New Password (Allows user to use any password they wish)
            async handleSavePassword(e) {
                e.preventDefault();

                const newPass = document.getElementById('newPassInput').value;
                const confirmPass = document.getElementById('confirmPassInput').value;

                if (newPass !== confirmPass) {
                    App.toast("Passwords do not match.", "warning");
                    return;
                }

                App.setLoading('saveNewPassBtn', true, 'Saving password...');

                try {
                    const client = typeof db !== 'undefined' ? db : (typeof supabase !== 'undefined' ? supabase : window.supabase);

                    const { error: updateErr } = await client.auth.updateUser({ 
                        password: newPass 
                    });

                    if (updateErr) throw updateErr;

                    App.toast("Password reset successful! Redirecting to login...", "success");
                    setTimeout(() => window.location.href = 'login.html', 1200);

                } catch (err) {
                    App.toast("Failed to update password: " + err.message, "error");
                    App.setLoading('saveNewPassBtn', false, 'Update & Save Password 🔒');
                }
            },

            async resendCode() {
                if (!this.targetEmail) return;

                App.toast("Resending code...", "info");
                try {
                    const res = await RefloOTP.requestOtp(this.targetEmail, 'recovery');
                    this.startCountdown(res.minutesRemaining * 60);
                    App.toast("New code sent to your email!", "success");
                } catch (err) {
                    App.toast("Could not resend: " + err.message, "error");
                }
            },

            resetToStep1() {
                RefloOTP.clearActiveSession();
                if (this.timerInterval) clearInterval(this.timerInterval);
                document.getElementById('step1EmailForm').style.display = 'block';
                document.getElementById('step2OtpForm').style.display = 'none';
                document.getElementById('step3PasswordForm').style.display = 'none';
                document.getElementById('resetSubtitle').innerText = 'Enter your email address to receive a 20-minute reset code.';
                App.setLoading('sendOtpBtn', false, 'Send 20-Minute Reset Code →');
            }
        };

        document.addEventListener('DOMContentLoaded', () => ForgotApp.init());
    </script>
</body>
</html>
