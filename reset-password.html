<!-- TITLE: reset-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFLO | Set New Password</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        .auth-page-wrapper { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg-body); }
        .auth-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: var(--bg-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .header-left-group { display: flex; align-items: center; gap: 10px; }
        .title-back-btn { background: none; border: none; font-size: 1.5rem; font-weight: 900; color: var(--text-main); cursor: pointer; padding: 0 4px 0 0; display: flex; align-items: center; }
        .auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 20px 60px; }
        .auth-card-box { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 32px; padding: 40px 30px; width: 100%; max-width: 460px; box-shadow: var(--shadow); text-align: center; }
        .input-group-item { margin-bottom: 16px; text-align: left; }
        .input-group-item label { display: block; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
        .auth-input-field { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--bg-card) !important; color: var(--text-main) !important; font-size: 0.95rem; font-weight: 600; outline: none; }
        .password-input-wrap { position: relative; display: flex; align-items: center; }
        .btn-toggle-pwd { position: absolute; right: 12px; background: none; border: none; font-size: 1.1rem; cursor: pointer; color: var(--text-muted); padding: 4px; }
        .strength-meter-wrap { height: 4px; background: var(--border); border-radius: 2px; margin: 6px 0 10px; overflow: hidden; }
        .strength-meter-fill { height: 100%; width: 0%; transition: width 0.3s; }
        .btn-auth-submit { width: 100%; padding: 16px; background: #2563eb !important; color: #ffffff !important; border: none; border-radius: 16px; font-size: 1.05rem; font-weight: 900; cursor: pointer; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
    </style>
</head>
<body class="auth-page-wrapper">

    <header class="auth-header">
        <div class="header-left-group">
            <button class="title-back-btn" onclick="location.href='login.html'">❮</button>
            <img src="assets/images/reflo-icon.png" alt="REFLO" style="height: 28px; width: 28px; object-fit: contain;">
            <span style="font-weight: 900; color: var(--primary); font-size: 1.15rem;">REFLO</span>
        </div>
        <button onclick="RefloTheme.toggle()" style="background: var(--bg-body); border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;">🌓</button>
    </header>

    <main class="auth-main">
        <div class="auth-card-box">
            <div style="font-size: 2.8rem; margin-bottom: 12px;">🔒</div>
            <h1 style="font-size: 1.7rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 6px;">Set New Password</h1>
            <p style="color: var(--text-muted); font-size: 0.88rem; font-weight: 600; margin-bottom: 25px;">
                Choose a strong, secure password for your REFLO business account.
            </p>

            <form id="resetPasswordForm" onsubmit="ResetPasswordApp.handleReset(event)">
                <div class="input-group-item">
                    <label>New Password (Min. 8 chars) *</label>
                    <div class="password-input-wrap">
                        <input type="password" id="newPassword" class="auth-input-field" placeholder="••••••••" required minlength="8" oninput="ResetPasswordApp.checkStrength(this.value)" autocomplete="new-password">
                        <button type="button" class="btn-toggle-pwd" onclick="ResetPasswordApp.toggleVisibility('newPassword', this)">👁️</button>
                    </div>
                    <div class="strength-meter-wrap">
                        <div class="strength-meter-fill" id="strengthMeter"></div>
                    </div>
                </div>

                <div class="input-group-item">
                    <label>Confirm New Password *</label>
                    <div class="password-input-wrap">
                        <input type="password" id="confirmNewPassword" class="auth-input-field" placeholder="••••••••" required minlength="8" autocomplete="new-password">
                        <button type="button" class="btn-toggle-pwd" onclick="ResetPasswordApp.toggleVisibility('confirmNewPassword', this)">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit" id="submitResetBtn">
                    Update & Save Password
                </button>
            </form>
<p class="reflo-powered-tag">
    <em>REFLO powered by HDC</em>
</p>
        </div>
    </main>

    <!-- DEPENDENCIES -->
<script src="assets/js/network-listener.js"></script>
<script src="assets/js/security.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        const ResetPasswordApp = {
            toggleVisibility(id, btn) {
                const input = document.getElementById(id);
                if (!input) return;
                input.type = input.type === 'password' ? 'text' : 'password';
                btn.style.opacity = input.type === 'password' ? '0.6' : '1';
            },

            checkStrength(val) {
                const meter = document.getElementById('strengthMeter');
                if (!val) { meter.style.width = '0%'; return; }
                let score = 0;
                if (val.length >= 8) score += 33;
                if (/[0-9]/.test(val)) score += 33;
                if (/[^A-Za-z0-9]/.test(val)) score += 34;
                meter.style.width = `${score}%`;
                meter.style.backgroundColor = score < 66 ? '#ef4444' : score < 100 ? '#f59e0b' : '#22c55e';
            },

            async handleReset(e) {
                e.preventDefault();

                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmNewPassword').value;

                if (newPassword !== confirmPassword) {
                    App.toast("Passwords do not match.", "warning");
                    return;
                }

                App.setLoading('submitResetBtn', true, 'Securing Password...');

                try {
                    const { error } = await db.auth.updateUser({
                        password: newPassword
                    });

                    if (error) throw error;

                    App.toast("Password updated securely! 🔒", "success");
                    setTimeout(() => window.location.href = 'login.html', 1200);

                } catch (err) {
                    App.toast("Password update failed: " + err.message, "error");
                    App.setLoading('submitResetBtn', false, 'Update & Save Password');
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => ResetPasswordApp.init());
    </script>
</body>
</html>
